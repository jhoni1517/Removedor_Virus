name: CelScan (testes)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o CelScan Agente (Android)
        run: bash agente/construir.sh

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: celscan/web/package-lock.json
      - name: Tipos e build da interface
        working-directory: celscan/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Página de verificação de laudos
        run: node site/v/teste.mjs

  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check celscan testes celscan.py
      - name: Pytest
        env:
          COLUMNS: "200"
        run: python -m pytest --cov=celscan --cov-report=term
