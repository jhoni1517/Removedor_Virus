name: Página de verificação de laudos

# Publica site/ no GitHub Pages (grátis para repositório público).
# Uma vez só: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    paths: ["site/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar a verificação (mesmo vetor do pytest)
        run: node site/v/teste.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
