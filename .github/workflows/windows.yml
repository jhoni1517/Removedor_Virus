name: Instalador Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agente:
    # O CelScan Agente (app auxiliar Android) é compilado no Linux, que já traz o Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o CelScan Agente
        run: bash agente/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: celscan-agente
          path: agente/build/celscan-agente.apk

  build:
    needs: agente
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: celscan-agente
          path: celscan/dados/agente

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: celscan/web/package-lock.json

      - name: Compilar a interface
        working-directory: celscan/web
        run: |
          npm ci
          npm run build

      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Testes
        env:
          COLUMNS: "200"
        run: python -m pytest

      - name: Baixar ADB oficial e scrcpy (vão embutidos)
        run: python instalador/baixar_dependencias.py

      - name: Ler versão
        id: versao
        shell: bash
        run: |
          v=$(python -c 'import celscan; print(celscan.__version__)')
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" =~ (a|b|rc|dev) ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Gerar executáveis
        run: pyinstaller --noconfirm --clean instalador/CelScan.spec

      - name: Testar o executável
        run: |
          dist\CelScan\celscan-cli.exe --help
          dist\CelScan\celscan-cli.exe bases

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.versao.outputs.versao }}" instalador\CelScan.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\CelScan -DestinationPath "dist\CelScan-Portatil-${{ steps.versao.outputs.versao }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CelScan-${{ steps.versao.outputs.versao }}
          path: |
            dist/CelScan-Setup-*.exe
            dist/CelScan-Portatil-*.zip

      # Publica ao enviar uma tag v* ou ao rodar manualmente (Actions > Run workflow).
      # Na execução manual, a tag v<versão> é criada automaticamente. Versões beta saem como pré-lançamento.
      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: CelScan ${{ steps.versao.outputs.versao }}
          prerelease: ${{ steps.versao.outputs.pre }}
          body: |
            Baixe **CelScan-Setup-${{ steps.versao.outputs.versao }}.exe**, execute e siga o instalador.
            Não precisa instalar Python nem ADB: tudo vem junto. Substitui o antigo "Removedor de Vírus Android".

            Versão portátil (sem instalar): **CelScan-Portatil-${{ steps.versao.outputs.versao }}.zip**.

            Se o Windows avisar "editor desconhecido", clique em *Mais informações > Executar assim mesmo*.
          files: |
            dist/CelScan-Setup-*.exe
            dist/CelScan-Portatil-*.zip
