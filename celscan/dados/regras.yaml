# Regras de pontuação do CelScan.
# Ajuste pesos e textos aqui sem mexer no código. Para personalizar só no seu computador,
# copie as regras que quiser mudar para ~/.celscan/regras.yaml (elas substituem estas).
#
# Cada regra de app:      peso (pontos), titulo, significa, fazer
# Cada regra de aparelho: nivel (ALTO/MÉDIO/BAIXO), titulo, significa, fazer
# {detalhe} no título é trocado pela informação específica (nome, meses, origem...).

versao: 1

limites:
  alto: 60          # pontos para risco ALTO
  medio: 30         # pontos para risco MÉDIO
  maximo: 100
  permitido_teto: 10  # app da lista de permitidos (vindo de loja oficial) fica no máximo com isto

parametros:
  patch_medio_meses: 12
  patch_alto_meses: 24
  recente_dias: 7
  sensor_dias: 7          # uso de câmera/microfone/etc. por app suspeito considerado recente
  notificacoes_dia: 20    # notificações por dia (média) para considerar excesso
  envio_mb: 50            # MB enviados por app escondido/de fora da loja para virar alerta

nota:               # nota do aparelho (0-100): começa em 100 e desconta
  aparelho_alto: 25
  aparelho_outro: 10
  app_alto: 30
  app_medio: 8
  teto_com_ameaca: 20
  rotulos:          # nota mínima -> rótulo (do maior para o menor)
    - [90, Excelente]
    - [70, Bom]
    - [50, Atenção]
    - [0, Crítico]

apps:
  ameaca_conhecida:
    peso: 100
    titulo: "Ameaça conhecida: {detalhe}"
    significa: "Este app aparece em listas públicas de spyware ou stalkerware (programas usados para espionar pessoas)."
    fazer: "Remova o app. Depois troque as senhas importantes (e-mail, banco, redes sociais) usando outro aparelho."
  acessibilidade:
    peso: 40
    titulo: "Controla a tela (acessibilidade ativa)"
    significa: "O app consegue ler tudo o que aparece na tela e tocar sozinho. Golpes bancários usam isso para ver senhas e fazer Pix."
    fazer: "Se não for um leitor de tela, gerenciador de senhas ou automação que você instalou de propósito, remova."
  administrador:
    peso: 30
    titulo: "É administrador do aparelho"
    significa: "O app ganhou poder de administrador, o que dificulta a desinstalação e pode bloquear a tela."
    fazer: "Tire o app de Configurações > Segurança > Apps de administrador e depois remova."
  device_owner:
    peso: 30
    titulo: "Controla o aparelho (device owner)"
    significa: "O app gerencia o celular inteiro. É normal em celular de empresa; fora disso, é muito suspeito."
    fazer: "Se o celular não é da empresa, procure uma assistência para restaurar o aparelho."
  leitor_notificacoes:
    peso: 20
    titulo: "Lê todas as notificações"
    significa: "O app vê o conteúdo de todas as notificações, inclusive códigos de SMS e mensagens."
    fazer: "Se você não reconhece o motivo, desative em Configurações > Notificações > Acesso às notificações."
  sem_icone:
    peso: 20
    titulo: "Escondido (sem ícone na tela inicial)"
    significa: "O app não aparece na lista de apps. Vírus fazem isso para você não conseguir encontrá-los."
    fazer: "Se você não sabe o que é, remova. Teclados, widgets e plugins às vezes também não têm ícone."
  fora_da_loja:
    peso: 15
    titulo: "Instalado fora da loja oficial ({detalhe})"
    significa: "O app veio de um arquivo baixado da internet ou de outro app, sem a verificação da loja."
    fazer: "Prefira sempre a Play Store. Se não lembra de ter instalado, remova."
  loja_alternativa:
    peso: 5
    titulo: "Instalado pela {detalhe} (loja alternativa)"
    significa: "Veio de uma loja alternativa conhecida, que verifica ou compila os apps. Não é a Play Store, mas não é um arquivo solto da internet."
    fazer: "Normal se você usa essa loja de propósito."
  transferido:
    peso: 5
    titulo: "Copiado de outro celular ({detalhe})"
    significa: "O app veio na transferência do celular antigo. Se no antigo ele tinha vindo da loja, está tudo certo."
    fazer: "Se não reconhece o app, remova. Se reconhece, reinstale pela loja para receber atualizações."
  sms_padrao:
    peso: 20
    titulo: "Definido como app de SMS padrão"
    significa: "O app recebe todos os SMS, inclusive códigos de banco e de recuperação de conta."
    fazer: "Volte o app de mensagens original como padrão em Configurações > Apps > Apps padrão."
  certificado_debug:
    peso: 25
    titulo: "Assinado com certificado de teste"
    significa: "Apps sérios publicados em loja não usam certificado de teste. É comum em apps modificados ou maliciosos."
    fazer: "Remova, a não ser que seja um app que você mesmo está desenvolvendo."
  virustotal_detectado:
    peso: 60
    titulo: "VirusTotal: {detalhe}"
    significa: "Antivírus de várias empresas identificaram este arquivo como perigoso."
    fazer: "Remova o app."
  virustotal_desconhecido:
    peso: 10
    titulo: "Arquivo nunca visto pelo VirusTotal"
    significa: "Ninguém enviou este app para análise antes. Não quer dizer que é vírus, mas é incomum para apps populares."
    fazer: "Se não reconhece o app, remova."
  imita_app_conhecido:
    peso: 60
    titulo: "Imita o app {detalhe}"
    significa: "O nome do app é parecido com o de um banco ou marca conhecida, mas ele não é o app oficial e veio de fora da loja. É o disfarce mais comum de golpes para roubar senhas e Pix."
    fazer: "Remova. Se precisar do app, instale o oficial pela Play Store, conferindo o nome da empresa que publica."
  certificado_falso:
    peso: 100
    titulo: "Cópia falsificada do {detalhe}"
    significa: "O app usa o mesmo nome de pacote do app oficial, mas foi assinado por outra pessoa. É uma versão modificada ou falsa."
    fazer: "Remova agora e reinstale o oficial pela Play Store. Troque as senhas usadas nele, a partir de outro aparelho."
  trojan_bancario:
    peso: 40
    titulo: "Combinação usada para roubar Pix"
    significa: "O app controla a tela (acessibilidade) e também consegue cobrir ou transmitir a tela. É exatamente o que trojans bancários fazem para trocar a chave Pix sem a vítima perceber."
    fazer: "Se você não reconhece o app, remova antes de abrir qualquer app de banco. Depois confira as últimas transações."
  sempre_ativo:
    peso: 5
    titulo: "Roda sempre (sem economia de bateria)"
    significa: "O app pediu para funcionar o tempo todo, mesmo com a tela desligada."
    fazer: "Normal para mensageiros e despertadores. Nos outros, tire a exceção em Configurações > Bateria."
  anuncio_popup:
    peso: 45
    titulo: "Abriu {detalhe}"
    significa: "O app mostrou propaganda em tela cheia por cima da tela inicial ou de outro app. São os pop-ups que aparecem do nada."
    fazer: "Remova o app. Se precisar dele, bloqueie em segundo plano e tire a permissão de sobrepor outros apps."
  anuncio_gatilho:
    peso: 30
    titulo: "Preparado para abrir anúncios {detalhe}"
    significa: "O app tem rede de anúncio, pode desenhar por cima de outros apps e fica escutando avisos do sistema para aparecer. É o jeito típico de adware."
    fazer: "Se aparecem anúncios do nada, remova este app primeiro."
  anuncio_tela_cheia:
    peso: 0
    titulo: "Mostrou {detalhe}"
    significa: "Anúncios dentro do próprio app são normais em apps e jogos gratuitos."
    fazer: "Nada a fazer, a não ser que incomode."
  anuncio_escondido:
    peso: 10
    titulo: "Esconde a tela de anúncio dos apps recentes"
    significa: "A propaganda não aparece na lista de apps abertos, o que dificulta descobrir de onde ela veio."
    fazer: "Se aparecem anúncios do nada, desconfie deste app."
  disfarce:
    peso: 10
    titulo: "Pode trocar o próprio nome e ícone para '{detalhe}'"
    significa: "O app tem um atalho alternativo pronto para se disfarçar de outro app. Alguns apps legítimos têm isso como função de privacidade; apps espiões usam para se esconder."
    fazer: "Se você não instalou o app por esse motivo, remova."
  disfarce_escondido:
    peso: 25
    titulo: "Escondido e pode se disfarçar de '{detalhe}'"
    significa: "O app não aparece na tela inicial e tem um ícone alternativo pronto para fingir ser outro app. É uma técnica comum de apps espiões."
    fazer: "Remova. Se suspeita que alguém instalou para vigiar você, guarde as provas antes."
  imita_pelo_nome:
    peso: 70
    titulo: "Usa o nome '{detalhe}', mas não é o app oficial"
    significa: "Na tela ele aparece com o nome de um banco ou marca conhecida, mas é outro app e veio de fora da loja. É assim que golpes enganam a vítima."
    fazer: "Remova agora. Instale o oficial pela Play Store, conferindo quem publica."
  finge_sistema:
    peso: 30
    titulo: "Finge ser parte do Android ({detalhe})"
    significa: "Um app comum, instalado fora da loja, se apresenta como peça do sistema para você não ter coragem de remover."
    fazer: "Apps do sistema de verdade vêm de fábrica ou da loja. Remova."
  sensor_recente:
    peso: 15
    titulo: "Usou {detalhe}"
    significa: "Um app escondido ou de fora da loja acessou câmera, microfone, localização ou SMS nos últimos dias."
    fazer: "Se você não abriu esse app nesse período, remova."
  mesmo_autor:
    peso: 30
    titulo: "Mesmo autor do app perigoso '{detalhe}'"
    significa: "Este app foi assinado com o mesmo certificado de um app de risco alto encontrado no celular. Quem fez um, fez o outro."
    fazer: "Remova junto com o app perigoso, a não ser que você conheça e confie neste."
  nome_com_truque:
    peso: 40
    titulo: "Nome com caracteres escondidos"
    significa: "O nome do app tem caracteres invisíveis ou que invertem o texto. É um truque para o nome parecer outro na tela."
    fazer: "Apps sérios não fazem isso. Remova, a não ser que você saiba exatamente o que é."
  instalou_outros:
    peso: 35
    titulo: "Instalou outros apps: {detalhe}"
    significa: "Este app, que não é uma loja oficial, colocou outros apps no celular. É o comportamento de um 'dropper', que baixa vírus em etapas."
    fazer: "Remova este app e também os apps que ele instalou, a não ser que você conheça e confie em todos."
  lote_suspeito:
    peso: 15
    titulo: "Instalado junto com {detalhe}"
    significa: "Vários apps de fora da loja apareceram no celular praticamente ao mesmo tempo. Isso acontece quando um vírus instala um pacote de apps de uma vez."
    fazer: "Confira se você instalou esses apps de propósito. Se não, remova todos."
  sem_nome:
    peso: 20
    titulo: "App sem nome"
    significa: "O app não tem um nome para mostrar. Apps normais sempre têm; apps maliciosos às vezes deixam em branco para passar despercebidos."
    fazer: "Se você não sabe o que é, remova."
  envio_dados:
    peso: 25
    titulo: "Enviou {detalhe} pela internet"
    significa: "Um app escondido ou de fora da loja mandou muitos dados do celular para a internet. Apps espiões enviam fotos, áudios e mensagens assim."
    fazer: "Se você não usa esse app para mandar arquivos, remova. Se suspeita de espionagem, guarde as provas antes."
  notificacoes_excesso:
    peso: 15
    titulo: "{detalhe}"
    significa: "O app manda notificações demais. Muitas vezes são propagandas ou avisos falsos de vírus."
    fazer: "Desligue as notificações dele em Configurações > Apps > Notificações, ou remova."
  padrao_espiao:
    peso: 40
    titulo: "Comportamento de app espião"
    significa: "O app se esconde (sem ícone ou com disfarce) e ao mesmo tempo lê a tela, as notificações ou usa câmera/microfone/localização. É o jeito de trabalhar dos apps de monitoramento (stalkerware), mesmo os que ainda não estão em nenhuma lista."
    fazer: "Se alguém pode ter mexido no seu celular, guarde as provas antes de remover e procure ajuda. Depois remova."
  instalador_forjado:
    peso: 50
    titulo: "Diz que veio da {detalhe}, mas foi instalado de outro jeito"
    significa: "O app foi marcado como se tivesse vindo da loja, mas quem fez a instalação foi outro programa ou um computador. Golpistas fazem isso para o app parecer confiável."
    fazer: "Remova e, se precisar do app, instale de novo direto pela loja."
  voltou:
    peso: 50
    titulo: "Voltou depois de removido (removido em {detalhe})"
    significa: "Este app já tinha sido removido numa visita anterior e apareceu de novo. Isso acontece quando outro app ou um site reinstala o vírus sozinho."
    fazer: "Remova de novo e procure o app que instala outros (veja os alertas 'Instalou outros apps'). Troque as senhas."
  dropper_ativo:
    peso: 30
    titulo: "Consegue instalar apps sozinho"
    significa: "Tem permissão para instalar apps e também controla a tela (acessibilidade), então pode tocar em 'Instalar' sem você. É assim que golpes bancários baixam a segunda parte do vírus."
    fazer: "Remova. Se o app for de automação que você instalou de propósito, tire pelo menos a permissão de instalar apps."
  intercepta_codigos:
    peso: 30
    titulo: "Pode ler códigos do banco"
    significa: "Lê SMS ou todas as notificações num celular com app de banco instalado. Com isso dá para pegar o código de confirmação de um Pix ou de troca de senha."
    fazer: "Se não for um app de mensagens ou relógio inteligente que você usa, remova antes de abrir o banco."
  golpe_emprestimo:
    peso: 30
    titulo: "Coleta sua agenda de contatos"
    significa: "App de fora da loja que lê contatos e também SMS ou registro de chamadas. É o perfil dos falsos apps de empréstimo que depois ameaçam expor a pessoa para os contatos."
    fazer: "Remova. Se já houve ameaça ou cobrança, guarde prints e registre ocorrência."
  teclado_suspeito:
    peso: 40
    titulo: "Teclado de fora da loja em uso"
    significa: "O teclado vê tudo o que você digita, inclusive senhas. Este teclado não veio de uma loja oficial."
    fazer: "Volte para o teclado original em Configurações > Sistema > Idiomas e entrada, e remova este app."
  instalado_recente:
    peso: 5
    titulo: "Instalado há {detalhe} dia(s)"
    significa: "Apps instalados logo antes de começarem os problemas merecem atenção."
    fazer: "Se os anúncios ou problemas começaram depois deste app, remova."

permissoes:
  android.permission.READ_SMS:
    peso: 20
    titulo: "Lê SMS"
    significa: "Pode ler códigos de confirmação do banco e de recuperação de contas."
    fazer: "Só apps de mensagens precisam disso. Revogue em Configurações > Apps > Permissões."
  android.permission.RECEIVE_SMS:
    peso: 15
    titulo: "Intercepta SMS"
    significa: "Recebe os SMS assim que chegam, antes de você ver."
    fazer: "Revogue se o app não for de mensagens."
  android.permission.SEND_SMS:
    peso: 15
    titulo: "Envia SMS"
    significa: "Pode mandar SMS pagos ou assinar serviços sem você saber."
    fazer: "Revogue se o app não for de mensagens."
  android.permission.READ_CALL_LOG:
    peso: 10
    titulo: "Lê o registro de chamadas"
    significa: "Sabe para quem você ligou e quem ligou para você."
    fazer: "Revogue se o app não for de telefone ou bloqueio de chamadas."
  android.permission.RECORD_AUDIO:
    peso: 10
    titulo: "Grava áudio"
    significa: "Pode usar o microfone."
    fazer: "Normal em mensageiros e gravadores. Nos outros, revogue."
  android.permission.ACCESS_BACKGROUND_LOCATION:
    peso: 10
    titulo: "Localização em segundo plano"
    significa: "Sabe onde você está mesmo com o app fechado."
    fazer: "Troque para 'Permitir só durante o uso' em Configurações > Apps > Permissões."
  android.permission.CAMERA:
    peso: 5
    titulo: "Usa a câmera"
    significa: "Pode tirar fotos e gravar vídeos."
    fazer: "Revogue se o app não precisa de câmera."
  android.permission.READ_CONTACTS:
    peso: 5
    titulo: "Lê os contatos"
    significa: "Tem acesso à sua agenda."
    fazer: "Revogue se o app não precisa dos contatos."
  android.permission.ACCESS_FINE_LOCATION:
    peso: 5
    titulo: "Localização precisa"
    significa: "Sabe exatamente onde você está."
    fazer: "Revogue se o app não precisa de mapa ou entrega."

appops:
  SYSTEM_ALERT_WINDOW:
    peso: 15
    titulo: "Desenha sobre outros apps"
    significa: "Pode abrir janelas por cima de tudo: anúncios em tela cheia ou telas falsas de banco."
    fazer: "Desative em Configurações > Apps > Acesso especial > Sobrepor a outros apps."
  PROJECT_MEDIA:
    peso: 20
    titulo: "Pode transmitir a tela"
    significa: "O app já pediu ou usou a captura de tela: consegue gravar ou enviar o que aparece no celular, inclusive senhas e códigos."
    fazer: "Só apps de gravação de tela ou reunião precisam disso. Se não reconhece, remova."
  REQUEST_INSTALL_PACKAGES:
    peso: 15
    titulo: "Pode instalar outros apps"
    significa: "Consegue instalar novos apps, inclusive vírus que baixa da internet."
    fazer: "Desative em Configurações > Apps > Acesso especial > Instalar apps desconhecidos."

aparelho:
  outros_usuarios:
    nivel: MÉDIO
    titulo: "Há {detalhe} além do dono"
    significa: "O celular tem outro usuário ou perfil (por exemplo 'perfil de trabalho'). Apps instalados só lá não aparecem na tela do dono e escapam de uma análise comum."
    fazer: "Se é celular da empresa, é normal. Se ninguém criou esse perfil, remova em Configurações > Sistema > Vários usuários."
  apps_em_outro_perfil:
    nivel: MÉDIO
    titulo: "Apps escondidos em outro perfil: {detalhe}"
    significa: "Estes apps existem só no outro usuário/perfil (perfil de trabalho, Pasta Segura ou usuário extra), fora da vista da tela principal."
    fazer: "Em celular da empresa ou na Pasta Segura do próprio dono é normal. Se ninguém reconhece, apague o perfil ou o usuário extra."
  apk_ameaca_guardado:
    nivel: ALTO
    titulo: "Instalador de ameaça guardado no celular: {detalhe}"
    significa: "Há um arquivo .apk de um vírus conhecido salvo no armazenamento, esperando para ser instalado (ou para reinstalar depois de removido)."
    fazer: "Apague o arquivo (o CelScan guarda uma cópia segura) e não abra arquivos .apk recebidos por mensagem."
  apks_guardados:
    nivel: BAIXO
    titulo: "{detalhe} guardado(s) no celular"
    significa: "São arquivos para instalar apps, normalmente baixados ou recebidos por mensagem. Se forem antigos, só ocupam espaço."
    fazer: "Apague os que você não reconhece ou não usa mais."
  popups:
    nivel: MÉDIO
    titulo: "{detalhe} abrindo anúncios fora do app"
    significa: "São os pop-ups de propaganda que aparecem na tela inicial ou por cima de outros apps."
    fazer: "Remova os apps marcados como 'Abriu anúncio fora do app'."
  vpn_sempre:
    nivel: MÉDIO
    titulo: "VPN sempre ligada: {detalhe}"
    significa: "Toda a internet do celular passa por esse app."
    fazer: "Normal se você instalou essa VPN de propósito. Se não reconhece, remova o app."
  vpn_ativa:
    nivel: BAIXO
    titulo: "VPN conectada agora"
    significa: "A internet está passando por um app de VPN neste momento."
    fazer: "Confira se você reconhece a VPN."
  dns_privado:
    nivel: BAIXO
    titulo: "DNS privado: {detalhe}"
    significa: "Os endereços de sites são consultados nesse servidor em vez do da operadora."
    fazer: "Normal se você configurou (bloqueador de anúncios, por exemplo). Se não, volte para Automático em Rede > DNS privado."
  risco_pix:
    nivel: ALTO
    titulo: "Risco de golpe no Pix: {detalhe}"
    significa: "Há um app com o conjunto de permissões usado por trojans bancários no mesmo celular que tem apps de banco."
    fazer: "Não use os apps de banco até remover o app suspeito. Depois confira as transações e, se houver algo estranho, ligue para o banco."
  patch_muito_antigo:
    nivel: ALTO
    titulo: "Atualização de segurança de {detalhe} meses atrás"
    significa: "O celular está sem correções de falhas conhecidas que vírus conseguem explorar."
    fazer: "Atualize em Configurações > Sistema > Atualização. Se não houver, o aparelho não recebe mais suporte."
  patch_antigo:
    nivel: MÉDIO
    titulo: "Atualização de segurança de {detalhe} meses atrás"
    significa: "O celular está algumas atualizações atrasado."
    fazer: "Procure atualizações em Configurações > Sistema > Atualização."
  proxy_global:
    nivel: ALTO
    titulo: "Proxy ativo ({detalhe})"
    significa: "Toda a internet do celular passa por outro computador, que pode ver e alterar o que você acessa."
    fazer: "Se você não configurou isso, remova o proxy e procure quem instalou."
  root:
    nivel: ALTO
    titulo: "Celular com root ({detalhe})"
    significa: "As proteções do Android foram desligadas. Qualquer app pode ganhar controle total."
    fazer: "Se não foi você quem fez o root, restaure o sistema original."
  bootloader:
    nivel: MÉDIO
    titulo: "Bootloader desbloqueado"
    significa: "O sistema pode ter sido modificado. Alguém com o celular na mão consegue instalar programas escondidos."
    fazer: "Se você não desbloqueou, leve a uma assistência de confiança."
  gerenciado:
    nivel: MÉDIO
    titulo: "Aparelho gerenciado por {detalhe}"
    significa: "Uma empresa ou app controla o celular. É normal em celular corporativo."
    fazer: "Se o celular é pessoal, descubra quem instalou esse controle."
  sms_incomum:
    nivel: MÉDIO
    titulo: "App de SMS padrão incomum: {detalhe}"
    significa: "Um app pouco conhecido recebe todos os seus SMS, inclusive códigos de banco."
    fazer: "Volte o app de mensagens original como padrão."
